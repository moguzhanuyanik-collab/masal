name: Quality Gate

on:
  push:
    branches:
      - main
      - 'migration-safety-*'
      - 'hardening-*'
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: PHP syntax
        shell: bash
        run: |
          if ! command -v php >/dev/null 2>&1; then
            echo "PHP CLI is not available on this runner."
            exit 1
          fi
          find . -type f -name '*.php' -not -path './vendor/*' -print0             | xargs -0 -n1 php -l

      - name: Node regression checks
        shell: bash
        run: |
          node tests/security-92.cjs
          node tests/migration-safety-93.cjs
          node tests/hardening-94.cjs
